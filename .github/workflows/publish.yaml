name: Publish Container

on:
  workflow_dispatch:
    inputs:
      old_tag:
        description: The tag that needs to be changed
        type: string
        required: true
      new_tag:
        description: The new tag
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  change_line:
    name: Change line
    uses: ./.github/workflows/change_line.yaml
    with:
      old_line: ${{ inputs.old_tag }}
      new_line: ${{ inputs.new_tag }}
      file_path: index.html
  publish:
    needs: change_line
    name: Publish Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mrmn2/technicalassignment:${{ inputs.new_tag }}
            ghcr.io/mrmn2/technicalassignment:latest
